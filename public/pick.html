<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Choice Helper</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --primary-hover: #2c5282;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --selected-bg: #ebf8ff;
            --selected-border: #3182ce;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-color);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* --- Form View --- */
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-reset {
            background-color: #718096;
            margin-top: 25px;
        }

        .btn-reset:hover {
            background-color: #4a5568;
        }

        /* --- Choice Presentation View --- */
        .choices-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        /* Large custom radio option cards for easy tapping/clicking */
        .choice-option {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .choice-option:hover {
            border-color: var(--primary-color);
        }

        .choice-option input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid #a0aec0;
            border-radius: 50%;
            outline: none;
            margin-right: 16px;
            display: grid;
            place-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .choice-option input[type="radio"]::before {
            content: "";
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: var(--primary-color);
        }

        .choice-option input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .choice-option input[type="radio"]:checked {
            border-color: var(--primary-color);
        }

        /* Style card when selected */
        .choice-option.selected {
            background-color: var(--selected-bg);
            border-color: var(--selected-border);
        }

        .choice-text {
            font-size: 1.35rem;
            font-weight: 500;
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Input View -->
    <div id="input-view">
        <h1>Create Options</h1>
        <label for="choices-input">Enter choices (one per line):</label>
        <textarea id="choices-input" placeholder="Go for a walk&#10;Play a board game&#10;Watch a movie&#10;Quiet time in room"></textarea>
        <button id="generate-btn">Show Choice View</button>
    </div>

    <!-- Generated Presentation View -->
    <div id="output-view" class="hidden">
        <h1>Please Select an Option</h1>
        <form id="choices-form">
            <div id="choices-container" class="choices-group"></div>
            <button type="button" id="reset-btn" class="btn-reset">← Back to Setup Form</button>
        </form>
    </div>
</div>

<script>
    const inputView = document.getElementById('input-view');
    const outputView = document.getElementById('output-view');
    const choicesInput = document.getElementById('choices-input');
    const generateBtn = document.getElementById('generate-btn');
    const resetBtn = document.getElementById('reset-btn');
    const choicesContainer = document.getElementById('choices-container');

    generateBtn.addEventListener('click', () => {
        const rawText = choicesInput.value.trim();
        
        if (!rawText) {
            alert('Please enter at least one choice.');
            return;
        }

        // Split text by line, remove empty lines
        const lines = rawText.split('\n')
                             .map(line => line.trim())
                             .filter(line => line.length > 0);

        // Clear previous options
        choicesContainer.innerHTML = '';

        // Build radio options
        lines.forEach((line, index) => {
            const label = document.createElement('label');
            label.className = 'choice-option';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'user_choice';
            radio.value = line;
            radio.id = `choice-${index}`;

            const textSpan = document.createElement('span');
            textSpan.className = 'choice-text';
            textSpan.textContent = line;

            // Highlight parent container when selected
            radio.addEventListener('change', () => {
                document.querySelectorAll('.choice-option').forEach(el => {
                    el.classList.remove('selected');
                });
                if (radio.checked) {
                    label.classList.add('selected');
                }
            });

            label.appendChild(radio);
            label.appendChild(textSpan);
            choicesContainer.appendChild(label);
        });

        // Switch views
        inputView.classList.add('hidden');
        outputView.classList.remove('hidden');
    });

    // Reset button functionality
    resetBtn.addEventListener('click', () => {
        outputView.classList.add('hidden');
        inputView.classList.remove('hidden');
        // Clear generated choices
        choicesContainer.innerHTML = '';
    });
</script>

</body>
</html>
